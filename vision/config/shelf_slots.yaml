# Which ArUco marker sits on which shelf slot, and where the item is compared with its marker.
#
# Marker frame (OpenCV's): origin at the CENTRE of the black square,
#   x = to the right, y = up, z = out of the marker towards the camera (all in mm).
# Stick each marker flat on the front edge of the shelf, BELOW the slot it names.
#
# item_offset_mm = [x, y, z] from the marker centre to the CENTRE of the item:
#   x: + if the item centre is to the right of the marker
#   y: + if the item centre is above the marker (usually + half the item height + a bit)
#   z: - if the item centre is behind the shelf edge (usually - half the item depth)
# Measure these with a ruler once the shelf is built. The numbers below are examples.

slots:
  0:  {name: top_left,     product: egg,        item_offset_mm: [0, 45, -30]}
  1:  {name: top_middle,   product: tea_leaves, item_offset_mm: [0, 60, -35]}
  2:  {name: top_right,    product: matchbox,   item_offset_mm: [0, 35, -25]}
  3:  {name: bottom_left,  product: biscuits,   item_offset_mm: [0, 50, -30]}
  4:  {name: bottom_right, product: toothpaste, item_offset_mm: [0, 40, -20]}
